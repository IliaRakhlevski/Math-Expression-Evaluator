name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cxx: g++
            flags: ""
          - name: Linux Clang
            os: ubuntu-latest
            cxx: clang++
            flags: ""
          - name: Linux GCC + sanitizers
            os: ubuntu-latest
            cxx: g++
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          - name: Windows MSVC
            os: windows-latest
            cxx: ""
            flags: ""

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CXX=${{ matrix.cxx }}; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMEE_WERROR=ON \
                -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
